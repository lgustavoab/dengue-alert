[project]
name = "dengue-alert"
version = "0.1.0"
description = "Sistema de alerta antecipado de risco de dengue em municípios brasileiros com dados epidemiológicos e meteorológicos."
readme = "README.md"
authors = [
    { email = "gustavoalmeida_122@hotmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"
